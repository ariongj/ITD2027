name: Publish ITD2027 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the newer website
        run: python3 alternative-v2/build.py
      - name: Check the publishing directory
        run: python3 scripts/check-pages.py
      - name: Build and check ITD2027/M (same content, SELCA-style look)
        run: |
          ITD_THEME=m python3 alternative-v2/build.py
          python3 scripts/check-pages.py alternative-v2/site-m
      - name: Build and check the calm alternative
        run: |
          python3 alternative-calm/build/build.py
          python3 alternative-calm/build/check.py
      - name: Assemble the site (proposal at the root, /M/ and the calm alternative under /calm/)
        run: |
          mkdir -p _site
          cp -R alternative-v2/site/. _site/
          mkdir -p _site/M
          cp -R alternative-v2/site-m/. _site/M/
          python3 alternative-calm/build/pages.py _site/calm
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
